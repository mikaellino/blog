<header class="p-3 text-bg-dark">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"> <a href="/"
                class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"> <svg class="bi me-2"
                    width="40" height="32" role="img" aria-label="Bootstrap">
                    <use xlink:href="#bootstrap"></use>
                </svg> </a>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="{{ url() }}" class="nav-link px-2 text-secondary">Home</a></li>
                <div class="dropdown">
                    <button class="btn text-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Categorias
                    </button>
                    <ul class="dropdown-menu">
                        {% for categoria in categorias %}
                        <li><a class="dropdown-item" href="{{url('categoria/' ~ categoria.id)}}">{{categoria.titulo}}</a></li>
                        {% endfor %}
                    </ul>
                </div>
                <li><a href="{{ url('sobre-nos')}}" class="nav-link px-2 text-white">Sobre</a></li>
            </ul>
            <div class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3 position-relative">
                <form data-url-busca="{{ url('buscar')}}" name="busca" role="search">
                    <input type="search" id="busca" class="form-control form-control-dark text-bg-dark" placeholder="Search..." aria-label="Search" name="busca">
                </form>
                <div id="buscaResultado" class="position-absolute w-100 bg-white border rounded mt-1" style="display: none; z-index: 1000; max-height: 300px; overflow-y: auto;"></div>
            </div>

            <div class="text-end"> <button type="button" class="btn btn-outline-light me-2">Entrar</button> <button
                    type="button" class="btn btn-warning">Cadastrar-se</button> </div>
        </div>
    </div>
</header>
